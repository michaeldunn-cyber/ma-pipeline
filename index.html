const toAT = deal => ({

  stage:            deal.stage || "sourcing",
  maType:           deal.maType || "Unclear",
  buSponsor:        deal.buSponsor || "TBD",

  ndaStatus:        deal.ndaStatus || "None",

  banker:           deal.banker || "",
  priceSignal:      deal.priceSignal || "",
  annualRevenue:    deal.annualRevenue || "",
  annualEbitda:     deal.annualEbitda || "",
  strategicThesis:  deal.strategicThesis || "",
  weeklyNotes:      deal.weeklyNotes || "",
  lastActivityDate: deal.lastActivityDate || "",
  blocker:          deal.blocker || "",
  blockerOwner:     deal.blockerOwner || "",
  waitingOn:        deal.waitingOn || "None",
  driveFolderUrl:   deal.driveFolderUrl || "",
  deckSummary:      deal.deckSummary || "",
  triageNotes:      deal.triageNotes || "",
  productPingNotes: deal.productPingNotes || "",
  triageMemoNotes:  deal.triageMemoNotes || "",
  icNotes:          deal.icNotes || "",
  passReason:       deal.passReason || "",
  stageHistory:     JSON.stringify(deal.stageHistory || []),
  aiMessages:       JSON.stringify(deal.aiMessages || []),
  documents:        JSON.stringify(deal.documents || []),
  commsLog:         JSON.stringify(deal.commsLog || []),
  briefData:        JSON.stringify(deal.briefData || {}),
  createdAt:        deal.createdAt || new Date().toISOString(),
  updatedAt:        new Date().toISOString(),
});

const fromAT = rec => ({
  id:               rec.id,
  atId:             rec.id,
  name:             rec.fields.name || "",
  stage:            rec.fields.stage || "sourcing",
  maType:           rec.fields.maType || "Unclear",
  buSponsor:        rec.fields.buSponsor || "TBD",
  platformPillar:   rec.fields.platformPillar || "TBD",
  ndaStatus:        rec.fields.ndaStatus || "None",
  ndaUrl:           rec.fields.ndaUrl || "",
  source:           rec.fields.source || "",
  banker:           rec.fields.banker || "",
  priceSignal:      rec.fields.priceSignal || "",
  annualRevenue:    rec.fields.annualRevenue || "",
  annualEbitda:     rec.fields.annualEbitda || "",
  strategicThesis:  rec.fields.strategicThesis || "",
  weeklyNotes:      rec.fields.weeklyNotes || "",
  lastActivityDate: rec.fields.lastActivityDate || "",
  blocker:          rec.fields.blocker || "",
  blockerOwner:     rec.fields.blockerOwner || "",
  waitingOn:        rec.fields.waitingOn || "None",
  driveFolderUrl:   rec.fields.driveFolderUrl || "",
  deckSummary:      rec.fields.deckSummary || "",
  triageNotes:      rec.fields.triageNotes || "",
  productPingNotes: rec.fields.productPingNotes || "",
  triageMemoNotes:  rec.fields.triageMemoNotes || "",
  icNotes:          rec.fields.icNotes || "",
  passReason:       rec.fields.passReason || "",
  stageHistory:     tryParse(rec.fields.stageHistory, []),
  aiMessages:       tryParse(rec.fields.aiMessages, []),
  documents:        tryParse(rec.fields.documents, []),
  commsLog:         tryParse(rec.fields.commsLog, []),
  briefData:        tryParse(rec.fields.briefData, {}),
  createdAt:        rec.fields.createdAt || rec.createdTime,
  updatedAt:        rec.fields.updatedAt || rec.createdTime,
});

function tryParse(str, fallback) {
  try { return str ? JSON.parse(str) : fallback; } catch { return fallback; }
}

const atApi = {
  async list() {
    let records = [], offset = null;
    do {
      const url = AT_URL + (offset ? `?offset=${offset}` : "");
      const res = await fetch(url, { headers: AT_HEADERS });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      records = records.concat(data.records || []);
      offset = data.offset;
    } while (offset);
    return records.map(fromAT);
  },
  async create(deal) {
    const res = await fetch(AT_URL, {
      method: "POST", headers: AT_HEADERS,
      body: JSON.stringify({ fields: toAT(deal) }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return fromAT(data);
  },
  async update(deal) {
    const res = await fetch(`${AT_URL}/${deal.atId}`, {
      method: "PATCH", headers: AT_HEADERS,
      body: JSON.stringify({ fields: toAT(deal) }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return fromAT(data);
  },
  async delete(atId) {
    await fetch(`${AT_URL}/${atId}`, { method: "DELETE", headers: AT_HEADERS });
  },
};

  const Arr = () => (
    <svg width="13" height="12" viewBox="0 0 13 12" style={{flexShrink:0,margin:"0 2px"}}>
      <path d="M1 6 L9 6 M6 2 L11 6 L6 10" fill="none" stroke="#c8c6be" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>

  );

  const Box = ({s, fw}) => {
    const on=active===s.id, isExp=expanded===s.id;
    return (
      <div onClick={()=>handleClick(s.id)} style={{cursor:"pointer",flex:fw?`0 0 ${fw}px`:1,background:on?s.color:s.light,border:`1px solid ${s.color}${on?"":"55"}`,borderRadius:8,padding:"8px 7px",transition:"all 0.12s",minWidth:0,outline:isExp?`2px solid ${s.color}`:"none",outlineOffset:1}}>

        <div style={{fontSize:10,color:on?"rgba(255,255,255,0.85)":s.color,marginTop:1,lineHeight:1.3}}>{s.label}</div>
        <div style={{fontSize:9,color:on?"rgba(255,255,255,0.6)":s.color+"99",marginTop:2}}>click for details</div>
      </div>
    );
  };

  return (
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:4}}>

// ── AI chat ────────────────────────────────────────────────────────────────────
function AIChat({deal, onUpdate}) {
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const msgs=deal.aiMessages||[];
  const QUICK=["Does this fit our M&A framework?","Draft a Product ping","Draft banker outreach","Key risks?","Write triage memo","Diligence questions"];
  const send=async(text)=>{
    if(!text.trim()||loading)return;
    const next=[...msgs,{role:"user",content:text},{role:"assistant",content:"AI features are currently unavailable. Anthropic API access is blocked by your IT administrator. All other CRM features work normally."}];
    onUpdate(next);setInput("");
    return;
    setLoading(true);
    try{
      const res=await fetch("https://ma-pipeline-proxy.michael-dunn-b37.workers.dev/anthropic/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:`You are an M&A analyst for Infillion (composable ad-tech). Framework: Type 1=composable component across BUs; Type 2=deep expertise in a customer type. Prefer limited cash upfront. MOS=dominant post-acquisition culture.\nDeal: ${deal.name||"Unknown"} | Stage: ${deal.stage} | Type: ${deal.maType} | BU: ${deal.buSponsor} | Price: ${deal.priceSignal||"none"}\nSummary: ${deal.deckSummary||"none"} | Triage: ${deal.triageNotes||"none"} | Product: ${deal.productPingNotes||"none"}\nBe direct, concise, commercially savvy.`,
        messages:next,
      })});
      const data=await res.json();
      onUpdate([...next,{role:"assistant",content:data.content?.[0]?.text||"No response."}]);
    }catch{onUpdate([...next,{role:"assistant",content:"Error reaching API."}]);}
    setLoading(false);
  };
  return (
    <div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
        {QUICK.map(q=><button key={q} onClick={()=>send(q)} style={{fontSize:11,padding:"3px 9px",borderRadius:20,border:"1px solid #d8d6ce",cursor:"pointer",background:"white",color:"#6b6963"}}>{q}</button>)}
      </div>
      <div style={{maxHeight:240,overflowY:"auto",display:"flex",flexDirection:"column",gap:7,marginBottom:8,background:"#f7f6f3",borderRadius:8,padding:10}}>
        {msgs.length===0&&<div style={{fontSize:12,color:"#b8b6ae",textAlign:"center",padding:"20px 0"}}>Ask anything about this deal</div>}
        {msgs.map((m,i)=>(
          <div key={i} style={{alignSelf:m.role==="user"?"flex-end":"flex-start",maxWidth:"85%",background:m.role==="user"?"#EEEDFE":"white",color:m.role==="user"?"#3C3489":"#1a1a18",border:m.role==="assistant"?"1px solid #e0ded6":"none",borderRadius:m.role==="user"?"12px 12px 2px 12px":"12px 12px 12px 2px",padding:"7px 11px",fontSize:12,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{m.content}</div>
        ))}
        {loading&&<div style={{alignSelf:"flex-start",fontSize:12,color:"#9e9c96",padding:"7px 11px"}}>Thinking…</div>}
      </div>
      <div style={{display:"flex",gap:6}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send(input)} placeholder="Ask anything about this deal…" style={inp} disabled={loading}/>
        <button onClick={()=>send(input)} disabled={loading||!input.trim()} style={{padding:"7px 14px",borderRadius:6,fontSize:13,fontWeight:600,background:"#534AB7",color:"white",border:"none",cursor:"pointer",opacity:loading||!input.trim()?0.5:1}}>Send</button>
      </div>
    </div>
  );
}

// ── Deal brief ────────────────────────────────────────────────────────────────
function DealBrief({deal, onUpdate}) {
  const EMPTY_BRIEF = {companySnapshot:"",revenue:"",ebitda:"",grossMargin:"",estValuation:"",customKpis:[{label:"",value:""},{label:"",value:""}],thesis:"",strategicFit:"",pros:"",risks:"",openQuestions:"",nextSteps:""};
  const [b, setB] = useState({...EMPTY_BRIEF,...(deal.briefData||{})});
  const [autofilling, setAutofilling] = useState(false);
  const [autofillStatus, setAutofillStatus] = useState("");

  const update = (newB) => {
    setB(newB);
    onUpdate({briefData: newB});
  };
  const set = (k,v) => update({...b,[k]:v});
  const setKpi = (i,field,val) => {
    const kpis = [...(b.customKpis||[{label:"",value:""},{label:"",value:""}])];
    kpis[i] = {...kpis[i],[field]:val};
    update({...b,customKpis:kpis});
  };
  const addKpi = () => update({...b,customKpis:[...(b.customKpis||[]),{label:"",value:""}]});
  const removeKpi = i => update({...b,customKpis:(b.customKpis||[]).filter((_,j)=>j!==i)});
  const kpis = b.customKpis||[{label:"",value:""},{label:"",value:""}];
  const stage = STAGES.find(x=>x.id===deal.stage)||STAGES[0];

  const autofill = async () => {
    setAutofillStatus("AI features unavailable");
    setTimeout(()=>setAutofillStatus(""),3000);
    return;
    setAutofilling(true);
    setAutofillStatus("Reading deal data...");
    const context = [
      deal.deckSummary && `DECK SUMMARY:\n${deal.deckSummary}`,
      deal.triageNotes && `SOLO TRIAGE NOTES:\n${deal.triageNotes}`,
      deal.productPingNotes && `PRODUCT PING NOTES:\n${deal.productPingNotes}`,
      deal.triageMemoNotes && `TRIAGE MEMO NOTES:\n${deal.triageMemoNotes}`,
      deal.icNotes && `IC NOTES:\n${deal.icNotes}`,
      deal.passReason && `PASS REASON:\n${deal.passReason}`,
      (deal.aiMessages||[]).length > 0 && `AI CHAT HISTORY:\n${deal.aiMessages.filter(m=>m.role==="assistant").map(m=>m.content).join("\n\n")}`,
    ].filter(Boolean).join("\n\n---\n\n");

    const prompt = `You are an M&A analyst at Infillion (composable ad-tech). Based on the deal information below, populate an internal deal brief. Return ONLY valid JSON, no markdown, no explanation.

Deal name: ${deal.name||"Unknown"}
Stage: ${deal.stage}
M&A type: ${deal.maType}
Platform pillar: ${deal.platformPillar}
Source: ${deal.source}
Banker: ${deal.banker}
Price signal: ${deal.priceSignal||"Unknown"}
Annual revenue: ${deal.annualRevenue||"Unknown"}
Annual EBITDA: ${deal.annualEbitda||"Unknown"}

DEAL INFORMATION:
${context||"No additional information available yet."}

Return this exact JSON structure:
{
  "companySnapshot": "1-2 sentence description of what the company does, where it operates, who it serves",
  "revenue": "revenue figure with label e.g. $9M ARR or $44M TTM or blank if unknown",
  "ebitda": "EBITDA figure e.g. $1.4M or blank if unknown",
  "grossMargin": "gross margin % e.g. 64% or blank if unknown",
  "estValuation": "estimated valuation range e.g. $40-70M or blank if unknown",
  "customKpis": [{"label": "KPI name", "value": "KPI value"}],
  "thesis": "2-3 sentences on why Infillion is considering this — maps to M&A framework (Type 1/2, platform pillars, composability)",
  "strategicFit": "2-3 sentences on how it plugs into Infillion stack and drives the flywheel across BUs",
  "pros": "3-5 bullet points as plain text lines starting with - on key strengths",

  "openQuestions": "2-4 bullet points as plain text lines starting with - on what still needs to be evaluated",
  "nextSteps": "2-3 bullet points as plain text lines starting with - on immediate next steps"
}

For customKpis, include 2-4 deal-specific metrics beyond the standard financial ones (e.g. MAUs, locations, clients, retention rate, publisher relationships). Only include metrics you have data for.`;

    try {
      setAutofillStatus("Generating brief...");
      const res = await fetch("https://ma-pipeline-proxy.michael-dunn-b37.workers.dev/anthropic/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({model:"claude-sonnet-4-20250514", max_tokens:1500, messages:[{role:"user",content:prompt}]})
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.[0]?.text||"{}";
      const clean = text.replace(/```json[\s\S]*?```/g, t => t.slice(7,-3)).replace(/```/g,"").trim();
      const jsonMatch = clean.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error("No JSON in response");
      const parsed = JSON.parse(jsonMatch[0]);
      // Read current briefData fresh from deal prop

        companySnapshot: existing.companySnapshot || parsed.companySnapshot || "",
        revenue:         existing.revenue         || deal.annualRevenue || parsed.revenue || "",
        ebitda:          existing.ebitda           || deal.annualEbitda  || parsed.ebitda  || "",

        customKpis:      (existing.customKpis||[]).filter(k=>k.label).length > 0

                               ? parsed.customKpis.filter(k=>k&&k.label)
                               : [{label:"",value:""},{label:"",value:""}],
        thesis:          existing.thesis           || parsed.thesis        || "",
        strategicFit:    existing.strategicFit     || parsed.strategicFit  || "",
        pros:            existing.pros             || parsed.pros           || "",
        risks:           existing.risks            || parsed.risks          || "",
        openQuestions:   existing.openQuestions    || parsed.openQuestions  || "",
        nextSteps:       existing.nextSteps        || parsed.nextSteps      || "",
      };
      update(merged);
      setAutofillStatus("Done");
      setTimeout(()=>setAutofillStatus(""),2000);
    } catch(e) {
      console.error("Autofill error:", e);
      setAutofillStatus("Error: " + (e.message||"try again"));

// ── Comms log ─────────────────────────────────────────────────────────────────
const COMMS_TYPES = ["Email","Call","Meeting","Other"];
function CommsLog({deal, onChange}) {
  const log = deal.commsLog || [];
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({type:"Email",counterparty:"",subject:"",notes:"",date:new Date().toISOString().slice(0,10)});
  const typeColor = {Email:"#534AB7",Call:"#0F6E56",Meeting:"#854F0B",Other:"#5F5E5A"};
  const typeBg   = {Email:"#EEEDFE",Call:"#E1F5EE",Meeting:"#FAEEDA",Other:"#F1EFE8"};
  return (
    <div>
      {log.length === 0 && !adding && <div style={{fontSize:12,color:"#9e9c96",padding:"12px 0"}}>No communications logged yet.</div>}
      {[...log].reverse().map((c,i) => (
        <div key={i} style={{padding:"10px 12px",background:"#f7f6f3",border:"1px solid #e0ded6",borderRadius:8,marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:typeBg[c.type]||"#F1EFE8",color:typeColor[c.type]||"#5F5E5A"}}>{c.type}</span>
            <span style={{fontSize:12,fontWeight:600,color:"#1a1a18"}}>{c.counterparty}</span>
            <span style={{fontSize:11,color:"#9e9c96",marginLeft:"auto"}}>{new Date(c.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</span>
            <button onClick={()=>onChange(log.filter((_,j)=>j!==log.length-1-i))} style={{background:"none",border:"none",cursor:"pointer",fontSize:15,color:"#b8b6ae",lineHeight:1,padding:"0 2px"}}>×</button>
          </div>
          {c.subject && <div style={{fontSize:12,fontWeight:500,color:"#1a1a18",marginBottom:2}}>{c.subject}</div>}
          {c.notes && <div style={{fontSize:12,color:"#6b6963",lineHeight:1.5}}>{c.notes}</div>}
        </div>
      ))}
      {adding ? (
        <div style={{background:"#f7f6f3",border:"1px solid #d8d6ce",borderRadius:8,padding:14,marginTop:6}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>

              <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={sel}>
                {COMMS_TYPES.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div><Label>Date</Label>
              <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={inp}/>
            </div>
          </div>
          <div style={{marginBottom:10}}><Label>Counterparty</Label><input value={form.counterparty} onChange={e=>setForm(f=>({...f,counterparty:e.target.value}))} placeholder="e.g. Chris Heasman, Canaccord" style={inp}/></div>
          <div style={{marginBottom:10}}><Label>Subject / topic</Label><input value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value}))} placeholder="e.g. Initial outreach re: Project Graphite" style={inp}/></div>
          <div style={{marginBottom:12}}><Label>Notes</Label><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Key points, outcomes, next steps…" style={ta}/></div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setAdding(false)} style={{padding:"6px 12px",borderRadius:6,fontSize:12,background:"none",border:"1px solid #d8d6ce",cursor:"pointer",color:"#6b6963"}}>Cancel</button>
            <button onClick={()=>{if(!form.counterparty)return;onChange([...log,{...form,id:Date.now().toString()}]);setForm({type:"Email",counterparty:"",subject:"",notes:"",date:new Date().toISOString().slice(0,10)});setAdding(false);}} disabled={!form.counterparty} style={{padding:"6px 14px",borderRadius:6,fontSize:12,fontWeight:600,background:"#534AB7",color:"white",border:"none",cursor:"pointer",opacity:!form.counterparty?0.5:1}}>Log it</button>

  );
}

        </div>
      </div>
    </div>
  );
}

// ── Gmail picker ───────────────────────────────────────────────────────────────
function GmailPicker({onSelect, onBack}) {
  const [query,setQuery]=useState('has:attachment CIM OR CIP OR "business overview" OR "investment opportunity"');
  const [emails,setEmails]=useState([]);
  const [loading,setLoading]=useState(false);
  const [reading,setReading]=useState(null);
  const search=async()=>{
    setLoading(true);setEmails([]);
    try{
      const res=await fetch("https://ma-pipeline-proxy.michael-dunn-b37.workers.dev/anthropic/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,mcp_servers:[{type:"url",url:"https://gmail.mcp.claude.com/mcp",name:"Gmail"}],messages:[{role:"user",content:`Search Gmail for: "${query}", maxResults:15. Return ONLY a JSON array, no markdown: [{"messageId":"...","subject":"...","from":"...","date":"...","snippet":"..."}]`}]})});
      const data=await res.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"[]";
      const match=text.match(/\[[\s\S]*\]/);
      setEmails(match?JSON.parse(match[0]):[]);
    }catch{setEmails([]);}
    setLoading(false);
  };
  const pick=async(email)=>{

// ── Weekly Draft Generator ────────────────────────────────────────────────────
function WeeklyReport({deals, onBack}) {
  const PROXY    = "https://ma-pipeline-proxy.michael-dunn-b37.workers.dev/anthropic/v1/messages";
  const ACTIVE   = ["sourcing","triage","product_ping","nda","triage_memo","ic_review","deep_diligence","hold"];
  const today    = new Date();
  const sevenAgo = new Date(today - 7*24*60*60*1000);
  const weekStr  = today.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});

  const [step,       setStep]       = React.useState("idle");
  const [qaItems,    setQaItems]    = React.useState([]);
  const [draftItems, setDraftItems] = React.useState([]);
  const [answers,    setAnswers]    = React.useState({});
  const [error,      setError]      = React.useState("");

  const activeDeals = deals.filter(d => ACTIVE.includes(d.stage));
  const isStale  = d => !d.lastActivityDate || new Date(d.lastActivityDate) < sevenAgo;
  const noNotes  = d => !d.weeklyNotes || !d.weeklyNotes.trim();
  const orphanBlock = d => d.blocker && d.blocker.trim() && (!d.blockerOwner || !d.blockerOwner.trim());

  const dealPayload = activeDeals.map(d => ({
    name:             d.name || "Unnamed",
    stage:            d.stage,
    maType:           d.maType,
    strategicThesis:  d.strategicThesis || "",
    weeklyNotes:      d.weeklyNotes || "",
    lastActivityDate: d.lastActivityDate || "",
    blocker:          d.blocker || "",
    blockerOwner:     d.blockerOwner || "",
    annualRevenue:    d.annualRevenue || "",
    banker:           d.banker || "",
    waitingOn:        d.waitingOn || "",
    staleActivity:    isStale(d),
    missingNotes:     noNotes(d),
    orphanBlocker:    orphanBlock(d),
  }));

  const callAPI = async (userMsg) => {
    const system = `You are a corporate development chief of staff at Infillion, a composable ad-tech company. Given structured deal data, produce two outputs as a JSON object:

1. "qaQuestions": array of {dealName, question} for any deal where missingNotes is true, staleActivity is true, or orphanBlocker is true. Questions must be specific — reference the deal name, last known activity, banker names, and blocker context. Ask one focused question per deal.

2. "draftItems": array of objects, one per deal, with keys: {dealName, status, thesis, whatsNew, nextStep, blocker}. Populate from the deal fields. Infer whatsNew from weeklyNotes (if blank, note it needs input). Infer nextStep from blocker, waitingOn, and stage. thesis comes from strategicThesis. status is a clean label for the stage. blocker is the blocker field or blank.

Rules: No em dashes anywhere. Be direct and executive-ready. Rob (CEO) cares about WHY each deal is on the list and what the concrete next step is — not legal minutiae unless it is a material blocker. Return ONLY valid JSON, no preamble, no markdown fences.`;

    const res = await fetch(PROXY, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 2500,
        system,
        messages: [{role:"user", content: userMsg}]
      })
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = (data.content?.[0]?.text || "{}").replace(/```json[\s\S]*?```|```/g,"").trim();
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) throw new Error("No JSON returned");
    return JSON.parse(match[0]);
  };

  const generate = async () => {
    setStep("loading"); setError("");
    try {
      const msg = "Here are the active deals:\n\n" + JSON.stringify(dealPayload, null, 2);
      const parsed = await callAPI(msg);
      setQaItems(parsed.qaQuestions || []);
      setDraftItems((parsed.draftItems || []).map(d => ({...d, _edited: false})));
      setStep("qa");
    } catch(e) {
      setError("Error: " + e.message);
      setStep("idle");
    }
  };

  const regenerate = async () => {
    setStep("loading"); setError("");
    try {
      const flaggedNames = qaItems.map(q => q.dealName);
      const answerBlock = Object.entries(answers).map(([k,v]) => `${k}: ${v}`).join("\n");
      const msg = "Here are the active deals:\n\n" + JSON.stringify(dealPayload, null, 2)
        + "\n\nAdditional context from Corp Dev answering QA questions:\n" + answerBlock
        + "\n\nOnly revise draftItems for these deals (leave others unchanged): " + flaggedNames.join(", ");
      const parsed = await callAPI(msg);
      // Merge — only replace flagged deals
      setDraftItems(prev => prev.map(existing => {
        const updated = (parsed.draftItems || []).find(n => n.dealName === existing.dealName);
        return updated && flaggedNames.includes(existing.dealName) ? {...updated, _edited: false} : existing;
      }));
      setQaItems([]);
      setStep("done");
    } catch(e) {
      setError("Error: " + e.message);
    }
  };

  const updateDraft = (idx, key, val) => {

          Pipeline
        </button>
        <div style={{fontSize:15,fontWeight:600,color:"#1a1a18"}}>Weekly draft</div>
        <div style={{flex:1}}/>
        <div style={{fontSize:11,color:"#9e9c96"}}>Week ending {weekStr}</div>
      </div>

      {/* Readiness bar */}
      <div style={{display:"flex",gap:20,padding:"10px 14px",background:"#f7f6f3",border:"1px solid #e0ded6",borderRadius:8,marginBottom:20,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:"#1a1a18"}}><b>{activeDeals.length}</b> active deals</span>
        <span style={{fontSize:11,color:"#993C1D"}}><b>{statCount(noNotes)}</b> missing weekly notes</span>
        <span style={{fontSize:11,color:"#854F0B"}}><b>{statCount(isStale)}</b> no activity this week</span>
        <span style={{fontSize:11,color:"#534AB7"}}><b>{statCount(d=>d.blocker&&d.blocker.trim())}</b> blocked</span>
      </div>

      {/* Idle */}
      {step==="idle"&&(
        <div style={{textAlign:"center",padding:"48px 0"}}>
          <div style={{fontSize:13,color:"#6b6963",maxWidth:440,margin:"0 auto 24px",lineHeight:1.7}}>
            Reads active deals, generates QA questions for anything missing context, and drafts the full weekly update. Run on Thursday afternoon to leave time for Friday follow-ups.
          </div>
          {error&&<div style={{fontSize:12,color:"#993C1D",marginBottom:16,padding:"8px 12px",background:"#FAECE7",borderRadius:6,display:"inline-block"}}>{error}</div>}
          <br/>
          <button type="button" onClick={generate} style={btnPrimary}>Generate Thursday draft</button>
        </div>
      )}

      {/* Loading */}
      {step==="loading"&&(
        <div style={{textAlign:"center",padding:"64px 0"}}>
          <div style={{fontSize:14,color:"#534AB7",fontWeight:600,marginBottom:6}}>Drafting...</div>
          <div style={{fontSize:12,color:"#9e9c96"}}>Reading pipeline and generating. About 15 seconds.</div>
        </div>
      )}

      {/* QA + Draft */}
      {(step==="qa"||step==="done")&&(
        <div style={{display:"grid",gridTemplateColumns:"340px 1fr",gap:20,alignItems:"start"}}>

          {/* Left: QA */}
          <div style={{position:"sticky",top:0}}>
            <div style={{fontSize:13,fontWeight:700,color:"#1a1a18",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
              Review before sending
              {qaItems.length>0&&<span style={{background:"#993C1D",color:"white",borderRadius:10,padding:"1px 7px",fontSize:11}}>{qaItems.length}</span>}
            </div>
            {qaItems.length===0?(
              <div style={{padding:"10px 12px",background:"#EAF3DE",border:"1px solid #3B6D1133",borderRadius:8,fontSize:12,color:"#27500A",marginBottom:12}}>
                No flags. All active deals have notes and recent activity.
              </div>
            ):(
              qaItems.map((item,i)=>(
                <div key={i} style={{marginBottom:10,padding:"10px 12px",background:"#FAECE7",border:"1px solid #993C1D33",borderRadius:8}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#712B13",marginBottom:4}}>{item.dealName}</div>
                  <div style={{fontSize:12,color:"#712B13",lineHeight:1.6,marginBottom:6}}>{item.question}</div>
                  <textarea
                    value={answers[item.dealName]||""}
                    onChange={e=>setAnswers(a=>({...a,[item.dealName]:e.target.value}))}
                    placeholder="Your answer..."
                    style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",border:"1px solid #993C1D55",borderRadius:5,fontSize:12,minHeight:52,resize:"vertical",fontFamily:"inherit",color:"#1a1a18",background:"white"}}
                  />
                </div>
              ))
            )}
            {qaItems.length>0&&(
              <button type="button" onClick={regenerate} style={{...btnPrimary,width:"100%",marginTop:4}}>
                Regenerate with answers
              </button>
            )}
            {error&&<div style={{fontSize:11,color:"#993C1D",marginTop:8}}>{error}</div>}
            <div style={{marginTop:12,display:"flex",gap:8}}>
              <button type="button" onClick={()=>setStep("idle")} style={btnSecondary}>Start over</button>
              <button type="button" onClick={exportPDF} style={{...btnPrimary,background:"#27500A",marginLeft:"auto"}}>Export PDF</button>
            </div>
          </div>

          {/* Right: Draft per deal */}
          <div>
            <div style={{fontSize:13,fontWeight:700,color:"#1a1a18",marginBottom:10}}>
              Weekly Draft
              <span style={{fontSize:11,color:"#9e9c96",fontWeight:400,marginLeft:8}}>edit inline before exporting</span>
            </div>
            {draftItems.map((d,i)=>(
              <div key={i} style={{marginBottom:14,padding:"12px 14px",border:"1px solid #e0ded6",borderRadius:8,background:d._edited?"#FFFDF5":"white"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{fontSize:13,fontWeight:700,color:"#1a1a18"}}>{d.dealName}</span>
                  <span style={{fontSize:11,background:"#EEEDFE",color:"#3C3489",padding:"1px 7px",borderRadius:10,fontWeight:600}}>{d.status}</span>
                  {d._edited&&<span style={{fontSize:10,color:"#854F0B",marginLeft:"auto"}}>edited</span>}
                </div>
                {/* Thesis */}
                <div style={{marginBottom:6}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#534AB7",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>Thesis</div>
                  <textarea value={d.thesis||""} onChange={e=>updateDraft(i,"thesis",e.target.value)}
                    style={{width:"100%",boxSizing:"border-box",padding:"5px 8px",border:"1px solid #e8e6de",borderRadius:5,fontSize:12,minHeight:40,resize:"vertical",fontFamily:"inherit",color:"#534AB7",fontWeight:500,background:"#EEEDFE44"}}/>
                </div>
                {/* What's new */}
                <div style={{marginBottom:6}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#9e9c96",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>This week</div>
                  <textarea value={d.whatsNew||""} onChange={e=>updateDraft(i,"whatsNew",e.target.value)}
                    style={{width:"100%",boxSizing:"border-box",padding:"5px 8px",border:"1px solid #e8e6de",borderRadius:5,fontSize:12,minHeight:52,resize:"vertical",fontFamily:"inherit",color:"#1a1a18"}}/>
                </div>
                {/* Next step */}
                <div style={{marginBottom: d.blocker ? 6 : 0}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#9e9c96",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>Next step</div>
                  <textarea value={d.nextStep||""} onChange={e=>updateDraft(i,"nextStep",e.target.value)}
                    style={{width:"100%",boxSizing:"border-box",padding:"5px 8px",border:"1px solid #e8e6de",borderRadius:5,fontSize:12,minHeight:36,resize:"vertical",fontFamily:"inherit",color:"#1a1a18"}}/>
                </div>
                {/* Blocker */}
                {d.blocker&&(
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:"#993C1D",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2,marginTop:6}}>Blocker</div>
                    <textarea value={d.blocker||""} onChange={e=>updateDraft(i,"blocker",e.target.value)}
                      style={{width:"100%",boxSizing:"border-box",padding:"5px 8px",border:"1px solid #993C1D44",borderRadius:5,fontSize:12,minHeight:32,resize:"vertical",fontFamily:"inherit",color:"#993C1D",background:"#FAECE744"}}/>
                  </div>
                )}
              </div>
            ))}
          </div>

        </div>
      )}
    </div>
  );
}


// ── Main app ───────────────────────────────────────────────────────────────────
function App() {
  const [deals,setDeals]   = useState([]);
  const [loaded,setLoaded] = useState(false);
  const [error,setError]   = useState(null);
  const [view,setView]     = useState({page:"list"});
  const [filter,setFilter] = useState("active");
  const [search,setSearch] = useState("");
  const [saving,setSaving] = useState(false);

  useEffect(()=>{
    atApi.list().then(ds=>{ setDeals(ds); setLoaded(true); })
      .catch(e=>{ setError(e.message); setLoaded(true); });
  },[]);

  const createDeal = async (partial={}) => {
    const d = blank(partial);
    setSaving(true);
    try {
      const created = await atApi.create(d);
      setDeals(prev=>[created,...prev]);
      setView({page:"deal", dealId:created.atId});
    } catch(e) { alert("Error creating deal: "+e.message); }
    setSaving(false);
  };

  const saveDeal = async (updated) => {
    setSaving(true);
    try {
      const saved = await atApi.update(updated);
      setDeals(prev=>prev.map(x=>x.atId===saved.atId?saved:x));
      setView({page:"list"});
    } catch(e) { alert("Error saving deal: "+e.message); }
    setSaving(false);
  };

  const deleteDeal = async (atId) => {
    setSaving(true);
    try {
      await atApi.delete(atId);
      setDeals(prev=>prev.filter(x=>x.atId!==atId));
      setView({page:"list"});
    } catch(e) { alert("Error deleting deal: "+e.message); }
    setSaving(false);
  };

  const toggleF = id => setFilter(f=>f===id?"active":id);

  const filtered = deals.filter(d=>{
    const fOk = filter==="all"?true:filter==="active"?!["passed","closed","hold"].includes(d.stage):filter==="waiting"?d.waitingOn&&d.waitingOn!=="None":filter==="hold"?d.stage==="hold":d.stage===filter;
    const sOk = !search||d.name.toLowerCase().includes(search.toLowerCase())||(d.deckSummary||"").toLowerCase().includes(search.toLowerCase());
    return fOk&&sOk;
  });

  if (!loaded) return <Spinner/>;

  if (error) return (
    <div style={{padding:24,maxWidth:500,margin:"0 auto"}}>
      <div style={{background:"#FAECE7",border:"1px solid #993C1D44",borderRadius:8,padding:16,fontSize:13,color:"#712B13",lineHeight:1.6}}>
        <strong>Could not connect to Airtable</strong><br/>{error}
      </div>
    </div>
  );

  if (view.page==="deal") {
    const deal=deals.find(x=>x.atId===view.dealId);
    if(!deal)return <div style={{padding:20,color:"#9e9c96"}}>Deal not found.</div>;
    return <DealDetail deal={deal} onSave={saveDeal} onBack={()=>setView({page:"list"})} onDelete={deleteDeal} saving={saving}/>;
  }
  if (view.page==="gmail")     return <GmailPicker onSelect={p=>{setView({page:"list"});createDeal(p);}} onBack={()=>setView({page:"list"})}/>;
  if (view.page==="analytics") return <Analytics deals={deals} onBack={()=>setView({page:"list"})}/>;
  if (view.page==="process")   return <ProcessPage onBack={()=>setView({page:"list"})}/>;
  if (view.page==="weekly")    return <WeeklyReport deals={deals} onBack={()=>setView({page:"list"})}/>;

  return (
    <div style={{padding:16,fontFamily:"inherit",maxWidth:700,margin:"0 auto",background:"white",minHeight:"100%"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div>
          <div style={{fontSize:17,fontWeight:700,color:"#1a1a18"}}>M&A pipeline</div>
          <div style={{fontSize:12,color:"#9e9c96"}}>Infillion Corp Dev</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setView({page:"process"})} style={{padding:"6px 11px",borderRadius:6,fontSize:12,background:"#f7f6f3",color:"#6b6963",border:"1px solid #d8d6ce",cursor:"pointer"}}>📋 Process</button>
          <button onClick={()=>setView({page:"weekly"})} style={{padding:"6px 11px",borderRadius:6,fontSize:12,background:"#f7f6f3",color:"#6b6963",border:"1px solid #d8d6ce",cursor:"pointer"}}>📊 Weekly</button>
          <button onClick={()=>setView({page:"analytics"})} style={{padding:"6px 11px",borderRadius:6,fontSize:12,background:"#f7f6f3",color:"#6b6963",border:"1px solid #d8d6ce",cursor:"pointer"}}>Analytics</button>
          <button onClick={()=>setView({page:"gmail"})} style={{padding:"6px 11px",borderRadius:6,fontSize:12,fontWeight:600,background:"#EEEDFE",color:"#3C3489",border:"1px solid #534AB744",cursor:"pointer"}}>+ Gmail</button>
          <button onClick={()=>createDeal()} disabled={saving} style={{padding:"6px 11px",borderRadius:6,fontSize:12,fontWeight:600,background:"#534AB7",color:"white",border:"none",cursor:"pointer",opacity:saving?0.6:1}}>+ New deal</button>
        </div>
      </div>

      <PipelineBar deals={deals} active={filter} onClick={toggleF}/>

      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        {[{id:"active",label:"Active"},{id:"waiting",label:"Waiting on…"},{id:"hold",label:"Hold"},{id:"passed",label:"Passed"},{id:"closed",label:"Closed"},{id:"all",label:"All"}].map(f=>(
          <button key={f.id} onClick={()=>setFilter(f.id)} style={{padding:"4px 12px",borderRadius:20,fontSize:12,cursor:"pointer",background:filter===f.id?"#534AB7":"#f7f6f3",color:filter===f.id?"white":"#6b6963",border:filter===f.id?"none":"1px solid #d8d6ce",fontWeight:filter===f.id?600:400}}>{f.label}</button>
        ))}
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" style={{...inp,flex:1,minWidth:120,padding:"4px 10px",fontSize:12}}/>
      </div>

      {filtered.length===0
        ?<div style={{textAlign:"center",padding:"40px 0",color:"#9e9c96",fontSize:14}}>{deals.length===0?"No deals yet — add your first deal to get started.":"No deals match this filter."}</div>
        :filtered.map(d=>{
          const waiting=d.waitingOn&&d.waitingOn!=="None";
          return(
            <div key={d.atId} onClick={()=>setView({page:"deal",dealId:d.atId})} style={{border:waiting?"1px solid #EF9F27":"1px solid #e0ded6",borderLeft:waiting?"3px solid #EF9F27":"1px solid #e0ded6",borderRadius:10,padding:"11px 13px",cursor:"pointer",marginBottom:8,background:"white"}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
                <div style={{fontWeight:600,fontSize:14,color:d.name?"#1a1a18":"#9e9c96",fontStyle:d.name?"normal":"italic"}}>{d.name||"Unnamed deal"}</div>
                <Tag id={d.stage}/>
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:5}}>
                {d.maType!=="Unclear"&&<span style={{fontSize:11,color:"#6b6963"}}>{d.maType}</span>}
                {d.platformPillar&&d.platformPillar!=="TBD"&&<span style={{fontSize:11,color:"#534AB7",fontWeight:600}}>{d.platformPillar}</span>}
                {d.ndaStatus&&d.ndaStatus!=="None"&&<span style={{fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:10,background:d.ndaStatus==="Signed"?"#EAF3DE":d.ndaStatus==="Infillion Version"||d.ndaStatus==="Counterparty Version"?"#FAEEDA":d.ndaStatus==="Requested"?"#EEEDFE":"#F1EFE8",color:d.ndaStatus==="Signed"?"#27500A":d.ndaStatus==="Infillion Version"||d.ndaStatus==="Counterparty Version"?"#633806":d.ndaStatus==="Requested"?"#3C3489":"#5F5E5A"}}>NDA {d.ndaStatus}</span>}
                {d.buSponsor!=="TBD"&&<span style={{fontSize:11,color:"#6b6963"}}>{d.buSponsor}</span>}
                {d.source&&<span style={{fontSize:11,color:"#6b6963"}}>{d.source}</span>}
                {d.annualRevenue&&<span style={{fontSize:11,color:"#1a1a18",fontWeight:600}}>{d.annualRevenue}</span>}
                {d.annualEbitda&&<span style={{fontSize:11,color:"#6b6963"}}>EBITDA {d.annualEbitda}</span>}
                {d.documents?.length>0&&<span style={{fontSize:11,color:"#534AB7",fontWeight:600}}>{d.documents.length} doc{d.documents.length>1?"s":""}</span>}
                {waiting&&<span style={{fontSize:11,color:"#854F0B",fontWeight:600}}>Waiting: {d.waitingOn}</span>}
              </div>
              {d.strategicThesis&&<div style={{fontSize:12,color:"#534AB7",fontWeight:600,marginTop:5,lineHeight:1.5}}>{d.strategicThesis}</div>}
              {d.deckSummary&&<div style={{fontSize:12,color:"#6b6963",marginTop:3,lineHeight:1.5}}>{d.deckSummary.slice(0,120)}{d.deckSummary.length>120?"…":""}</div>}
            </div>
          );
        })
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
